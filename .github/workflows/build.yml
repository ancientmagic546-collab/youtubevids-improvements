name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Find JAR
        id: jar
        run: |
          JAR=$(find build/libs -name 'youtubevids-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' | head -1)
          if [ -z "$JAR" ]; then
            echo "No JAR found in build/libs"
            ls -la build/libs/ || true
            exit 1
          fi
          echo "path=$JAR" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR"
          ls -la build/libs/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtubevids-mod
          path: ${{ steps.jar.outputs.path }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: YouTube Vids Improvements v1.0.0
          body: |
            **YouTube Vids Improvements** for Minecraft 1.21.11 (Fabric)

            - Context-aware left-click (spear / mace sequences)
            - Toggle keybind: G (Options → Controls → Key Binds)
            - Client-side only

            Drop the JAR into `.minecraft/mods` with Fabric API.
          files: ${{ steps.jar.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
